name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.4.0
      - run: uv sync --extra dev --python ${{ matrix.python }}
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync pyright
      - run: uv run --no-sync pytest --cov=neuralopt --cov-report=term-missing
      - run: uv build --python ${{ matrix.python }}
      - run: uv run --no-sync twine check dist/*
  release-metadata:
    # Runs on every PR: version, CITATION.cff, .zenodo.json, CHANGELOG and release notes agree.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          python-version: "3.12"
      - run: uv run --no-project --with packaging python scripts/check_release.py
      - run: uvx cffconvert==2.0.0 --validate
      - run: python -m json.tool .zenodo.json > /dev/null
