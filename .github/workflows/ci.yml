name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --extra dev --python ${{ matrix.python }}
      - run: uv run --no-sync ruff check src tests
      - run: uv run --no-sync pyright
      - run: uv run --no-sync pytest --cov=neuralopt --cov-report=term-missing
      - run: uv build --python ${{ matrix.python }}
      - run: uv run --no-sync twine check dist/*

