[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "neuralopt"
version = "0.5.0"
description = "A compact learned optimizer with native restricted-domain certification"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "Abhinav Mishra", email = "42838835+bibymaths@users.noreply.github.com"}]
dependencies = ["jax>=0.4.35", "numpy>=1.26"]
classifiers = ["Development Status :: 3 - Alpha", "Programming Language :: Python :: 3"]

[project.optional-dependencies]
train = ["optax>=0.2.4"]
benchmark = [
    "optimistix>=0.1.0",
    "scipy>=1.12",
]
sde = ["diffrax>=0.7.2"]
dev = ["pytest>=8", "pytest-cov>=5", "hypothesis>=6", "ruff>=0.8", "pyright>=1.1", "build>=1.2", "twine>=6", "optax>=0.2.4", "scipy>=1.12"]
docs = ["zensical>=0.0.8"]

[project.scripts]
neuralopt = "neuralopt.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/neuralopt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.11"
typeCheckingMode = "basic"

