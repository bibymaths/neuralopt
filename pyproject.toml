[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "neuralopt"
version = "0.7.0"
description = "A JAX research package for learned optimization, with replayable interval certification"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "Abhinav Mishra", email = "42838835+bibymaths@users.noreply.github.com"}]
dependencies = ["jax>=0.4.35", "numpy>=1.26"]
keywords = ["learned optimization", "learned optimizers", "JAX", "meta-learning", "interval arithmetic", "global optimization"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Mathematics",
]

[project.optional-dependencies]
train = ["optax>=0.2.4"]
benchmark = [
    "optimistix>=0.1.0",
    "scipy>=1.12",
]
sde = ["diffrax>=0.7.2"]
dev = ["pytest>=8", "pytest-cov>=5", "hypothesis>=6", "ruff>=0.8", "pyright>=1.1", "build>=1.2", "twine>=6", "optax>=0.2.4", "scipy>=1.12"]

[dependency-groups]
# Not published in package metadata (PyPI forbids direct git references). The mike fork
# is Zensical's versioning tool; it is not on PyPI, so it is pinned to a commit.
docs = [
    "zensical>=0.1.1",
    "mkdocstrings-python>=1.10",
    "mike @ git+https://github.com/squidfunk/mike@2d4ad799442f4592db8ad53b179bfb33db8c69ac",
]

[project.urls]
Homepage = "https://bibymaths.github.io/neuralopt/"
Documentation = "https://bibymaths.github.io/neuralopt/"
Repository = "https://github.com/bibymaths/neuralopt"
Changelog = "https://github.com/bibymaths/neuralopt/blob/main/CHANGELOG.md"
"Release notes" = "https://bibymaths.github.io/neuralopt/latest/release-notes/"

[project.scripts]
neuralopt = "neuralopt.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/neuralopt"]

[tool.hatch.build.targets.sdist]
# Source, tests (with the frozen checkpoints they load), docs and release metadata.
# Research outputs (results/) and internal tooling folders stay in the repository only.
exclude = ["/.claude", "/.superpowers", "/results", "/site", "/.cache", "/dist"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.11"
typeCheckingMode = "basic"

