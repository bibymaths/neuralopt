[project]
site_name = "NeuralOpt"
site_description = "A JAX research package for learned optimization, with replayable interval certification"
site_author = "Abhinav Mishra"
site_url = "https://bibymaths.github.io/neuralopt/"
docs_dir = "docs"
repo_name = "bibymaths/neuralopt"
repo_url = "https://github.com/bibymaths/neuralopt"
edit_uri = "edit/main/docs/"
copyright = "Copyright © 2026 Abhinav Mishra · MIT License"
use_directory_urls = true

# Internal working documents (docs/plans, docs/superpowers) are built but not listed.
nav = [
  { "Home" = "index.md" },
  { "Getting started" = [
    { "Installation" = "installation.md" },
    { "Quickstart" = "quickstart.md" },
    { "When to use NeuralOpt" = "when-to-use.md" },
  ] },
  { "User guide" = [
    { "Learned mode" = "guide/learned-mode.md" },
    { "Certified mode" = "guide/certified-mode.md" },
    { "Compiled engine" = "guide/compiled-engine.md" },
  ] },
  { "Research reports" = [
    { "v0.8: amortized families (under test)" = [
      { "Claims register" = "research/v0.8-claims.md" },
      { "Gate F0: headroom, no learning" = "research/f0-v0.8.md" },
      { "Pre-registration (frozen, stop point 3)" = "research/v0.8-preregistration.md" },
      { "Pre-registration amendments" = "research/v0.8-preregistration-amendments.md" },
      { "Training and validation choices (no test opened)" = "research/v0.8-training.md" },
      { "v0.8-B B-S2: baselines and headroom" = "research/v0.8-b-b0.md" },
      { "v0.8-B pre-registration (frozen)" = "research/v0.8-b-preregistration.md" },
      { "v0.8-B pre-registration amendments" = "research/v0.8-b-preregistration-amendments.md" },
    ] },
    { "v0.7: compiled engine and Gram-space model" = [
      { "Engine speed (Track A)" = "research/engine-speed-v0.7.md" },
      { "Gram-space model (Track B, negative)" = "research/gram-space-v0.7.md" },
    ] },
    { "v0.6: trajectory curvature" = [
      { "Pre-registered study (negative)" = "research/trajectory-curvature-v0.6.md" },
      { "Experiments" = "research/trajectory-curvature-experiments.md" },
      { "Literature" = "research/trajectory-curvature-literature.md" },
    ] },
    { "v0.5: transferable geometry" = [
      { "Transferable geometry (negative)" = "research/transferable-geometry.md" },
    ] },
    { "v0.4: distribution-aware training" = [
      { "Distribution-aware training (negative)" = "research/distribution-aware-training.md" },
    ] },
    { "v0.3: stochastic geometry" = [
      { "Langevin theory" = "research/langevin-theory.md" },
      { "Fokker–Planck diagnostics" = "research/fokker-planck.md" },
      { "Gibbs measures" = "research/gibbs-measures.md" },
      { "Function spaces" = "research/function-spaces.md" },
      { "Stochastic novelty" = "research/stochastic-novelty.md" },
      { "Stochastic limitations" = "research/stochastic-limitations.md" },
    ] },
    { "v0.2: outcome-driven foundation" = [
      { "Training" = "research/training.md" },
      { "Benchmarks" = "research/benchmarks.md" },
      { "Certified scheduling" = "research/certification.md" },
      { "Generalization" = "research/generalization.md" },
      { "Trajectory diagnostics" = "research/trajectory-diagnostics.md" },
      { "Hamiltonian theory" = "research/hamiltonian-theory.md" },
      { "Hamiltonian correctness" = "research/hamiltonian-correctness.md" },
      { "Hamiltonian related work" = "research/hamiltonian-related-work.md" },
    ] },
