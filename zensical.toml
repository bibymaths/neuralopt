      { "Experiment plan" = "research/experiment-plan.md" },
      { "Literature" = "research/literature.md" },
      { "Novelty" = "research/novelty.md" },
      { "Limitations (v0.1–v0.2)" = "research/limitations.md" },
      { "Smoke benchmark" = "benchmarks/smoke.md" },
    ] },
  ] },
  { "Release notes" = [
    { "All releases" = "release-notes/index.md" },
    { "v0.7.0" = "release-notes/v0.7.0.md" },
    { "v0.6.0" = "release-notes/v0.6.0.md" },
    { "v0.5.0" = "release-notes/v0.5.0.md" },
    { "v0.4.0" = "release-notes/v0.4.0.md" },
    { "v0.3.0" = "release-notes/v0.3.0.md" },
    { "v0.2.0" = "release-notes/v0.2.0.md" },
    { "v0.1.0" = "release-notes/v0.1.0.md" },
  ] },
  { "Changelog" = "changelog.md" },
  { "Limitations" = "limitations.md" },
  { "Citing NeuralOpt" = "citing.md" },
  { "API reference" = "api.md" },
]

[project.theme]
name = "material"
language = "en"
logo = "assets/images/icon.svg"
favicon = "assets/images/favicon/favicon-32x32.png"
features = [
  "navigation.instant",
  "navigation.tracking",
  "navigation.sections",
  "navigation.path",
  "navigation.footer",
  "navigation.top",
  "navigation.indexes",
  "search.highlight",
  "content.action.edit",
  "content.action.view",
  "content.code.copy",
  "content.tooltips",
]

[project.theme.icon]
repo = "fontawesome/brands/github"

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "indigo"
accent = "deep purple"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "indigo"
accent = "deep purple"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.theme.font]
text = "Inter"
code = "JetBrains Mono"

[project.extra]
generator = false

# Versioned docs: Zensical's mike fork (pinned in pyproject's docs group) deploys one
# folder per minor version to gh-pages, with aliases "latest" (newest release, default)
# and "dev" (main).
[project.extra.version]
provider = "mike"
default = "latest"
alias = true

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/bibymaths/neuralopt"
name = "NeuralOpt on GitHub"

[project.markdown_extensions]
admonition = {}
attr_list = {}
md_in_html = {}
tables = {}

[project.markdown_extensions.toc]
permalink = true

[project.markdown_extensions.pymdownx.details]

[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true

[project.markdown_extensions.pymdownx.inlinehilite]

[project.markdown_extensions.pymdownx.snippets]
check_paths = true

[project.markdown_extensions.pymdownx.superfences]

[project.markdown_extensions.pymdownx.arithmatex]
generic = true

[project.plugins.mkdocstrings]
default_handler = "python"

[project.plugins.mkdocstrings.handlers.python]
paths = ["src"]

[project.plugins.mkdocstrings.handlers.python.options]
show_source = false
show_root_heading = true
show_root_full_path = false
show_signature_annotations = true
separate_signature = true
merge_init_into_class = true
members_order = "source"
